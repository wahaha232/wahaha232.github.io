<body>

  <!-- 藍色 Header（圖片版首頁：僅導覽列，Hero 視覺已內建於圖片） -->
  <header class="site-header site-header--slim">
    <div class="site-header__bar">
      <a class="site-logo" href="index.html" aria-label="PlayHub — home">
        <span class="site-logo__icon" aria-hidden="true">🎮</span>
        <span class="site-logo__text">Play<span class="site-logo__accent">Hub</span></span>

      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a class="site-nav__link" href="index.html">Home</a>
        <a class="site-nav__link" href="#games">Games</a>
        <a class="site-nav__link" href="about.html">About</a>
      </nav>

      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle menu">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>
    </div>
  </header>

  <main class="page page--shot">

    <!-- 首頁設計圖（直接作為首頁主視覺；Checkers 可玩，用 PLAY NOW 按鈕覆蓋圖上的 Coming Soon 字樣） -->
    <div class="design-shot-wrap">
      <img
        class="design-shot"
        src="homepage.png"
        usemap="#playhub-map"
        alt="PlayHub homepage — WELCOME TO PLAYHUB, game categories and featured games: Chess, Checkers, Sudoku, Space Invaders, Solitaire, Quiz"
        width="1536"
        height="1024"
      />
      <a class="overlay-play" href="games/checkers.html" title="Play Checkers — Classic Checkers Game">PLAY NOW</a>
    </div>

    <!-- 設計圖上的互動熱區：點卡片進入對應遊戲（座標為 1536×1024 原圖座標） -->
    <map name="playhub-map" id="playhub-map">
      <area shape="rect" coords="36,614,300,952" href="games/chess.html" title="Chess" alt="Play Chess — Classic Chess Game" />
      <area shape="rect" coords="304,614,556,952" href="games/checkers.html" title="Checkers" alt="Play Checkers — Classic Checkers Game" />
      <area shape="rect" coords="560,614,796,952" href="#games" data-soon="Sudoku" title="Sudoku — Coming Soon" alt="Sudoku — coming soon" />
      <area shape="rect" coords="800,614,1036,952" href="#games" data-soon="Space Invaders" title="Space Invaders — Coming Soon" alt="Space Invaders — coming soon" />
      <area shape="rect" coords="1038,614,1270,952" href="games/solitaire.html" title="Solitaire" alt="Play Solitaire — Classic Solitaire Game" />
      <area shape="rect" coords="1274,614,1500,952" href="#games" data-soon="Quiz" title="Quiz — Coming Soon" alt="Quiz — coming soon" />
    </map>

    <!-- ═══════════════════════════════════════════════════════════
         AdSense 版位：Leaderboard（728×90）
         中文：啟用時貼上你的 <ins class="adsbygoogle"> 程式碼。
         ═══════════════════════════════════════════════════════════ -->
    <div class="ad-slot ad-slot--leaderboard">
      <span class="ad-slot__label">Advertisement</span>
      <!-- 啟用後貼上你的 <ins class="adsbygoogle"> 程式碼 -->
    </div>

  </main>

  <!-- 深藍 Footer -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__brand">© 2025 PlayHub. All rights reserved.</p>
      <nav class="site-footer__nav" aria-label="Footer navigation">
        <a href="about.html">About Us</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="privacy.html">Terms of Service</a>
        <a href="mailto:hello@playhubgames.com">Contact</a>
      </nav>
    </div>
  </footer>

  <!-- Coming Soon 提示彈窗（尚未開發的遊戲） -->
  <div class="modal is-hidden" id="soon-modal" role="dialog" aria-modal="true" aria-labelledby="soon-title">
    <div class="modal__box">
      <button class="modal__close" id="soon-close" type="button" aria-label="Close">×</button>
      <p class="modal__icon" aria-hidden="true">🔒</p>
      <h2 class="modal__title" id="soon-title">Coming Soon</h2>
      <p class="modal__game" id="soon-name">Ludo</p>
      <p class="modal__text">This game is currently under development.</p>
    </div>
  </div>

  <!-- 圖片熱區互動：未開發的遊戲顯示 Coming Soon 提示 -->
  <script>
    (function () {
      "use strict";
      var modal = document.getElementById("soon-modal");
      var modalName = document.getElementById("soon-name");
      var close = document.getElementById("soon-close");
      if (!modal) return;

      function show(name) {
        if (modalName) modalName.textContent = name;
        modal.classList.remove("is-hidden");
      }
      function hide() {
        modal.classList.add("is-hidden");
      }
      if (close) close.addEventListener("click", hide);
      modal.addEventListener("click", function (event) {
        if (event.target === modal) hide();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") hide();
      });
      document.querySelectorAll("#playhub-map area[data-soon]").forEach(function (area) {
        area.addEventListener("click", function (event) {
          event.preventDefault();
          show(area.getAttribute("data-soon"));
        });
      });
    })();
  </script>

  <noscript>
    <p class="noscript-note">PlayHub — Free Online Games.</p>
  </noscript>
</body>
